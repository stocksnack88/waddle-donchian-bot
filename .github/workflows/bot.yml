name: donchian-bot

# GitHub throttles scheduled workflows (often ~1-3h between fires on free repos),
# so instead of one check per fire, each run is a ~5.5h polling loop. When it
# times out, the next scheduled fire restarts it -> near-continuous coverage.
# State lives in Supabase (waddle_bot_state); the concurrency group stops two
# loops ever overlapping.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: donchian-bot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: run polling loop (~5.5h, then exit for the next fire)
        env:
          DATA_SOURCE: okx
          WADDLE_SUPABASE_URL: ${{ secrets.WADDLE_SUPABASE_URL }}
          WADDLE_SUPABASE_KEY: ${{ secrets.WADDLE_SUPABASE_KEY }}
        run: timeout 20000 python bot.py --poll 120 || true
