name: publish-status

# Hourly: read the trade log from Supabase and commit state/status.json so the
# weekly-check routine (which can't reach Supabase) can read it from GitHub.

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

concurrency:
  group: publish-status
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install httpx pandas

      - name: build status.json
        env:
          WADDLE_SUPABASE_URL: ${{ secrets.WADDLE_SUPABASE_URL }}
          WADDLE_SUPABASE_KEY: ${{ secrets.WADDLE_SUPABASE_KEY }}
        run: python publish_status.py

      - name: commit if changed
        run: |
          git config user.name "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add state/status.json
          git diff --cached --quiet || git commit -m "status update [skip ci]"
          git push
